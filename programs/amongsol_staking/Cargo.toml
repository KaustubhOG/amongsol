[package]
name = "amongsol-staking"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amongsol_staking"

[features]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["no-idl"]

[dependencies]
anchor-lang = "0.30.1"
proc-macro2 = { version = "1", features = ["span-locations"] }

[package.metadata.cargo-build-sbf]
no-default-features = true
